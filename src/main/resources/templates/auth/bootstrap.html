<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{bootstrap.title}">系統初始化</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main id="bootstrap-app" class="panel"><p class="eyebrow">SOUTHWND ERP</p><h1 th:text="#{bootstrap.heading}">首次系統初始化</h1><form @submit.prevent="submit"><label for="bootstrap-org" th:text="#{bootstrap.label.org_name}">組織名稱</label><input id="bootstrap-org" v-model.trim="form.organizationName" required maxlength="200"><label for="bootstrap-email" th:text="#{bootstrap.label.admin_email}">管理員 Email</label><input id="bootstrap-email" v-model.trim="form.email" type="email" required><label for="bootstrap-password" th:text="#{bootstrap.label.admin_password}">管理員密碼</label><input id="bootstrap-password" v-model="form.password" type="password" minlength="12" required><button type="submit" :disabled="loading" th:text="#{bootstrap.button.submit}">{{ loading ? MSG('bootstrap.button.processing') : MSG('bootstrap.button.submit') }}</button><p id="message" role="alert">{{ message }}</p></form></main><script th:inline="javascript">window.__ERP_MESSAGES__ = /*[[${messages}]]*/ {};</script><script src="/webjars/vue/3.5.18/dist/vue.global.prod.js"></script><script src="/webjars/axios/1.11.0/dist/axios.min.js"></script><script src="/webjars/sweetalert2/11.23.0/dist/sweetalert2.all.min.js"></script><script src="/js/auth-bootstrap.js"></script></body>
</html>
