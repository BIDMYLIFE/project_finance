<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{dashboard.title}">ERP 工作台</title><link rel="stylesheet" href="/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/dashboard.css"></head>
<body><main id="dashboard-app" class="dashboard-shell" v-cloak>
  <nav class="navbar navbar-expand-lg dashboard-nav" aria-label="主要導覽"><div class="container-fluid"><a class="navbar-brand" href="/">SOUTHWND ERP</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" th:aria-label="#{dashboard.nav.not_yet_available}"></button>
    <div id="main-navigation" class="collapse navbar-collapse"><ul class="navbar-nav me-auto mb-2 mb-lg-0"><li v-for="item in capabilities" :key="item.id" class="nav-item"><a v-if="item.available && item.route" class="nav-link" :href="item.route">{{ item.label }}</a><span v-else class="nav-link disabled" aria-disabled="true" role="status" v-html="item.label + ' <small>' + MSG('dashboard.nav.not_yet_available') + '</small>'"></span></li></ul><button class="btn btn-outline-light" type="button" @click="logout" :disabled="loggingOut">{{ loggingOut ? MSG('dashboard.nav.logging_out') : MSG('dashboard.nav.logout') }}</button></div>
  </div></nav>
  <div class="container py-4"><p class="eyebrow" th:text="#{dashboard.eyebrow}">管理工作台</p><h1 th:text="#{dashboard.welcome}">歡迎回來</h1><section class="identity-panel" aria-labelledby="identity-heading"><h2 id="identity-heading" th:text="#{dashboard.identity.title}">目前身份</h2>
    <p v-if="ui.loading" role="status" aria-live="polite" th:text="#{dashboard.identity.loading}">載入身分資料中...</p>
    <div v-else-if="ui.networkError" class="alert alert-warning" role="alert">
      <p th:text="#{dashboard.identity.network_error}">網路連線失敗，請檢查連線後重試。</p>
      <button class="btn btn-sm btn-outline-secondary" type="button" @click="loadIdentity" :disabled="ui.loading" th:text="#{dashboard.identity.retry}">重試</button>
    </div>
    <p v-else-if="ui.error" class="alert alert-warning" role="alert">{{ ui.error }} <button class="btn btn-sm btn-link" type="button" @click="loadIdentity" th:text="#{dashboard.identity.retry}">重試</button></p>
    <dl v-else-if="identity"><dt th:text="#{dashboard.identity.email}">Email</dt><dd>{{ identity.email }}</dd><dt th:text="#{dashboard.identity.organization_name}">組織名稱</dt><dd>{{ identity.organizationName }}</dd><dt th:text="#{dashboard.identity.role_name}">角色</dt><dd>{{ identity.roleName }}</dd></dl>
    <p v-else role="status" th:text="#{dashboard.identity.no_data}">目前沒有可顯示的身分資料。</p>
  </section></div>
</main><script src="/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="/webjars/vue/3.5.18/dist/vue.global.prod.js"></script><script src="/webjars/axios/1.11.0/dist/axios.min.js"></script><script src="/webjars/sweetalert2/11.23.0/dist/sweetalert2.all.min.js"></script><script th:inline="javascript">window.__ERP_MESSAGES__ = /*[[${messages}]]*/ {};</script><script src="/js/api-client.js"></script><script src="/js/erp-state.js"></script><script src="/js/capability-registry.js"></script><script src="/js/dashboard.js"></script></body></html>
