<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${messages.title}">Invoice receipt</title><link rel="stylesheet" href="/css/invoice-receipt.css"></head>
<body><main class="invoice-receipt"><div class="receipt-actions"><button type="button" onclick="window.print()" th:text="${messages.print}">Print receipt</button></div><section class="receipt-sheet"><h1 th:text="${messages.title}">Invoice receipt</h1><dl><dt>發票號碼</dt><dd th:text="${invoice.invoiceNumber}">INV</dd><dt>客戶</dt><dd th:text="${invoice.customerName}">—</dd><dt>發票日期</dt><dd th:text="${invoice.invoiceDate}">—</dd><dt>到期日</dt><dd th:text="${invoice.dueDate}">—</dd></dl><table><thead><tr><th>項目</th><th>數量</th><th>金額</th></tr></thead><tbody><tr th:each="line : ${invoice.lines}"><td th:text="${line.productName}">—</td><td th:text="${line.quantity}">0</td><td th:text="${line.lineTotal + ' ' + invoice.currencyCode}">0</td></tr></tbody></table><p class="receipt-total">總額：<strong th:text="${invoice.grandTotal + ' ' + invoice.currencyCode}">0</strong></p></section></main><script>window.addEventListener('load', function () { window.print(); });</script></body></html>
