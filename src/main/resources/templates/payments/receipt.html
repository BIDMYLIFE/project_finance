<!doctype html><html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>收款收據</title><link rel="stylesheet" href="/css/payments.css"></head><body><main class="receipt-page"><div class="receipt-actions"><button type="button" onclick="window.print()">列印</button></div><section class="receipt-copy" th:each="copy : ${ {'存根聯','客戶收據聯','會計聯'} }"><h1 th:text="${copy}">收據</h1><p>收據編號：<strong th:text="${payment.receiptNumber}">RCT</strong></p><p>付款人：<span th:text="${payment.payerName}">—</span></p><p>事由：<span th:text="${payment.reason}">—</span></p><p>金額：<span th:text="${payment.amount + ' ' + payment.currencyCode}">0</span></p><p>付款方式：<span th:text="${payment.paymentMethod}">—</span></p><p>收款日期：<span th:text="${payment.receivedAt}">—</span></p><p th:if="${payment.note != null and !payment.note.isBlank()}">備註：<span th:text="${payment.note}">—</span></p></section></main></body></html>
