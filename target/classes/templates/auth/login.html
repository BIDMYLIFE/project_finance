<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{login.title}">登入</title><link rel="stylesheet" href="/css/auth.css"></head>
<body><main id="login-app" class="panel"><p class="eyebrow">SOUTHWND ERP</p><h1 th:text="#{login.heading}">管理員登入</h1><form @submit.prevent="submit"><label for="login-email" th:text="#{login.label.email}">Email</label><input id="login-email" v-model.trim="form.email" type="email" required><label for="login-password" th:text="#{login.label.password}">密碼</label><input id="login-password" v-model="form.password" type="password" required><button type="submit" :disabled="loading" th:text="#{login.button.submit}">{{ loading ? MSG('login.button.logging_in') : MSG('login.button.submit') }}</button><p id="message" role="alert">{{ message }}</p></form></main><script th:inline="javascript">window.__ERP_MESSAGES__ = /*[[${messages}]]*/ {};</script><script src="/webjars/vue/3.5.18/dist/vue.global.prod.js"></script><script src="/webjars/axios/1.11.0/dist/axios.min.js"></script><script src="/webjars/sweetalert2/11.23.0/dist/sweetalert2.all.min.js"></script><script src="/js/auth-login.js"></script></body>
</html>
